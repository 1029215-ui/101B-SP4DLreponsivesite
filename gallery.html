<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="logo.png">
  <link rel="stylesheet" type="text/css" href="style.css">
  <title>101 Bagels | Gallery</title>

<style>
/* --- SLEEK ARTISTIC IMAGE GALLERY --- */

#gallery-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  padding: 20px;
}

#gallery-grid .item img {
  width: 100%;
  height: 240px;
  object-fit: cover;
  border-radius: 15px;
  box-shadow: 0px 4px 15px rgba(0,0,0,0.25);
  cursor: pointer;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}

#gallery-grid .item img:hover {
  transform: scale(1.05);
  box-shadow: 0px 6px 25px rgba(0,0,0,0.35);
}

/* --- LIGHTBOX (Full-size image popup) --- */

#lightbox {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.8);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

#lightbox img {
  max-width: 90%;
  max-height: 85%;
  border-radius: 10px;
  box-shadow: 0px 8px 30px rgba(255,255,255,0.3);
  animation: fadeIn 0.25s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: scale(0.95); }
  to   { opacity: 1; transform: scale(1); }
}
</style>

</head>

<body>

<!-- Logo -->
<div id="logo">
  <img src="logo.png" alt="101 Bagels Logo" width="100" height="99">
</div>

<!-- Header -->
<div class="Header">
  <a href="index.html" class="button">Home</a>
  <a href="menu.html" class="button">Menu</a>
  <a href="about.html" class="button">About</a>
  <a href="gallery.html" class="button">Gallery</a>
  <a href="contact.html" class="button">Contact</a>
</div>
	
<!-- Content -->
<div class="Content">

  <div class="gallery-banner">
    <h1>Gallery</h1>
  </div>

  <!-- Gallery Grid -->
  <div class="featured-items" id="gallery-grid">

    <!-- Row 1 -->
    <div class="item"><img src="placeholder1.jpg" alt=""></div>
    <div class="item"><img src="placeholder2.jpg" alt=""></div>
    <div class="item"><img src="placeholder3.jpg" alt=""></div>

    <!-- Row 2 -->
    <div class="item"><img src="placeholder4.jpg" alt=""></div>
    <div class="item"><img src="placeholder5.jpg" alt=""></div>
    <div class="item"><img src="placeholder6.jpg" alt=""></div>

    <!-- Row 3 -->
    <div class="item"><img src="placeholder7.jpg" alt=""></div>
    <div class="item"><img src="placeholder8.jpg" alt=""></div>
    <div class="item"><img src="placeholder9.jpg" alt=""></div>

  </div>
</div>

<!-- LIGHTBOX (hidden until image is clicked) -->
<div id="lightbox">
  <img src="" alt="">
</div>

<!-- Footer -->
<div class="Footer">
  <p><strong>101 Bagels & Subs</strong><br>
     760-421-6555<br>
     Oceanside, CA</p>

  <div class="footer-buttons">
      <a href="menu.html" class="button">Menu</a>
      <a href="contact.html" class="button">Contact / Address</a>
      <a href="gallery.html" class="button">Gallery / Social Media</a>
  </div>

  <p>Copyright &copy; <span id="year"></span> 101 Bagels</p>
</div>

<script>
document.getElementById("year").textContent = new Date().getFullYear();

/* --- LIGHTBOX SCRIPT --- */
const lightbox = document.getElementById("lightbox");
const lightboxImg = lightbox.querySelector("img");

document.querySelectorAll("#gallery-grid img").forEach(img => {
  img.addEventListener("click", () => {
    lightboxImg.src = img.src;
    lightbox.style.display = "flex";
  });
});

lightbox.addEventListener("click", () => {
  lightbox.style.display = "none";
});
</script>

</body>
</html>
