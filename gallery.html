<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="logo.png">
  <link rel="stylesheet" type="text/css" href="style.css">
  <title>101 Bagels | Gallery</title>
</head>
<body>
   <!-- Logo (clickable) -->
  <div id="logo">
    <a href="index.html">
      <img src="logo.png" alt="101 Bagels Logo" width="100" height="99">
    </a>
  </div>

  <div class="Header">
    <a href="index.html" class="button">Home</a>
    <a href="menu.html" class="button">Menu</a>
    <a href="about.html" class="button">About</a>
    <a href="gallery.html" class="button">Gallery</a>
    <a href="contact.html" class="button">Contact</a>
  </div>

  <h1>Photo Gallery</h1>
  <div class="gallery">
    <img src="bagel1.jpg" alt="Fresh Bagel">
    <img src="bagel2.jpg" alt="Coffee and Bagel Combo">
    <img src="sandwich1.jpg" alt="Turkey Sandwich">
  </div>

<!-- Footer -->
  <div class="Footer">
    <p><strong>101 Bagels & Subs</strong><br>
    760-421-6555<br>
    Oceanside, CA</p>

    <div class="footer-buttons">
      <a href="menu.html" class="button">Menu</a>
      <a href="about.html" class="button">About</a>
      <a href="contact.html" class="button">Contact / Address</a>
    </div>

    <p>Copyright &copy; <span id="year"></span> 101 Bagels</p>
  </div>

  <!-- Script to auto-update year -->
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</html>
